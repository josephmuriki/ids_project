{% extends "base.html" %}
{% block content %}

<h2>User Management</h2>

<table class="card">
<tr>
<th>ID</th>
<th>Full Name</th>
<th>Email</th>
<th>Username</th>
<th>Role</th>
<th>Action</th>
</tr>

{% for u in users %}
<tr>
<td>{{ u[0] }}</td>
<td>{{ u[1] }}</td>
<td>{{ u[2] }}</td>
<td>{{ u[3] }}</td>
<td>{{ u[4] }}</td>
<td>
<a href="/delete_user/{{ u[0] }}" 
onclick="return confirm('Delete this user?')" 
class="glow-btn">Delete</a>
</td>
</tr>
{% endfor %}
</table>

{% endblock %}
